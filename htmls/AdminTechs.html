<div class="at-site" data-page="AdminTechs" id="at-root">
<header class="at-top">
    <button type="button" class="at-burger" aria-label="Open menu" onclick="AdminTechsJs.openMenu()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="at-logo" href="Admin"><svg viewBox="0 0 40 40" width="36" height="36" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#1E2A33"/><path d="M9 20.5 20 11l11 9.5" fill="none" stroke="#F7F4EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 19v11h14V19" fill="none" stroke="#F7F4EE" stroke-width="3" stroke-linejoin="round"/><path d="M20 30c-2.6 0-4-1.7-4-3.6 0-2.4 2.4-3.4 2.4-5.7 1.7.9 2.8 2.4 2.8 4 .5-.3.9-.9 1-1.6.8.8 1.8 1.9 1.8 3.3 0 1.9-1.4 3.6-4 3.6z" fill="#E2622B"/></svg><span id="at-brand">Staff</span><small>Staff</small></a>
    <div class="at-who" id="at-who"></div>
    <a class="at-tl at-tlv" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="at-tl" onclick="AdminTechsJs.signout()">Sign out</button>
</header>
<div class="at-body">
    <nav class="at-rail" id="at-rail" aria-label="Staff menu">
        <div class="at-rail-top"><b>Menu</b><button type="button" class="at-ibtn" aria-label="Close menu" onclick="AdminTechsJs.closeMenu()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="at-menu" id="at-menu"></div>
    </nav>
    <div class="at-scrim" id="at-scrim" onclick="AdminTechsJs.closeMenu()"></div>
    <main class="at-main" id="at-main"><div class="at-loading">Loading</div></main>
</div>
<div class="at-modal" id="at-modal" aria-hidden="true">
    <div class="at-mbox" role="dialog" aria-modal="true" aria-labelledby="at-mtitle">
        <div class="at-mhead"><h2 id="at-mtitle"></h2><button type="button" class="at-ibtn" aria-label="Close" onclick="AdminTechsJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="at-mbody" id="at-mbody"></div>
    </div>
</div>
<div class="at-pk" id="at-pk" aria-hidden="true">
    <div class="at-mbox at-pkbox" role="dialog" aria-modal="true" aria-labelledby="at-pkt">
        <div class="at-mhead"><h2 id="at-pkt">Choose a photo</h2><button type="button" class="at-ibtn" aria-label="Close" onclick="AdminTechsJs.pkClose()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="at-mbody">
            <div class="at-pkbar"><input type="search" id="at-pkq" placeholder="Search by name or description" maxlength="40" oninput="AdminTechsJs.pkSearch()" aria-label="Search photos"><label class="at-btn at-btn-ghost at-btn-sm at-upbtn"><input type="file" id="at-pkfile" accept="image/jpeg,image/png,image/webp,image/gif" multiple onchange="AdminTechsJs.pkUpload()">Upload new</label></div>
            <p class="at-upmsg" id="at-pkmsg" role="status"></p>
            <div class="at-pkgrid" id="at-pkgrid"></div>
        </div>
    </div>
</div>
<div class="at-toast" id="at-toast" role="status" aria-live="polite"></div>
</div>
