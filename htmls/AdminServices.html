<div class="as-site" data-page="AdminServices" id="as-root">
<header class="as-top">
    <button type="button" class="as-burger" aria-label="Open menu" onclick="AdminServicesJs.openMenu()"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
    <a class="as-logo" href="Admin"><svg viewBox="0 0 40 40" width="36" height="36" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#1E2A33"/><path d="M9 20.5 20 11l11 9.5" fill="none" stroke="#F7F4EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 19v11h14V19" fill="none" stroke="#F7F4EE" stroke-width="3" stroke-linejoin="round"/><path d="M20 30c-2.6 0-4-1.7-4-3.6 0-2.4 2.4-3.4 2.4-5.7 1.7.9 2.8 2.4 2.8 4 .5-.3.9-.9 1-1.6.8.8 1.8 1.9 1.8 3.3 0 1.9-1.4 3.6-4 3.6z" fill="#E2622B"/></svg><span id="as-brand">Staff</span><small>Staff</small></a>
    <div class="as-who" id="as-who"></div>
    <a class="as-tl as-tlv" href="Home" target="_blank" rel="noopener">View site</a>
    <button type="button" class="as-tl" onclick="AdminServicesJs.signout()">Sign out</button>
</header>
<div class="as-body">
    <nav class="as-rail" id="as-rail" aria-label="Staff menu">
        <div class="as-rail-top"><b>Menu</b><button type="button" class="as-ibtn" aria-label="Close menu" onclick="AdminServicesJs.closeMenu()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="as-menu" id="as-menu"></div>
    </nav>
    <div class="as-scrim" id="as-scrim" onclick="AdminServicesJs.closeMenu()"></div>
    <main class="as-main" id="as-main"><div class="as-loading">Loading</div></main>
</div>
<div class="as-modal" id="as-modal" aria-hidden="true">
    <div class="as-mbox" role="dialog" aria-modal="true" aria-labelledby="as-mtitle">
        <div class="as-mhead"><h2 id="as-mtitle"></h2><button type="button" class="as-ibtn" aria-label="Close" onclick="AdminServicesJs.closeModal()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="as-mbody" id="as-mbody"></div>
    </div>
</div>
<div class="as-pk" id="as-pk" aria-hidden="true">
    <div class="as-mbox as-pkbox" role="dialog" aria-modal="true" aria-labelledby="as-pkt">
        <div class="as-mhead"><h2 id="as-pkt">Choose a photo</h2><button type="button" class="as-ibtn" aria-label="Close" onclick="AdminServicesJs.pkClose()"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
        <div class="as-mbody">
            <div class="as-pkbar"><input type="search" id="as-pkq" placeholder="Search by name or description" maxlength="40" oninput="AdminServicesJs.pkSearch()" aria-label="Search photos"><label class="as-btn as-btn-ghost as-btn-sm as-upbtn"><input type="file" id="as-pkfile" accept="image/jpeg,image/png,image/webp,image/gif" multiple onchange="AdminServicesJs.pkUpload()">Upload new</label></div>
            <p class="as-upmsg" id="as-pkmsg" role="status"></p>
            <div class="as-pkgrid" id="as-pkgrid"></div>
        </div>
    </div>
</div>
<div class="as-toast" id="as-toast" role="status" aria-live="polite"></div>
</div>
