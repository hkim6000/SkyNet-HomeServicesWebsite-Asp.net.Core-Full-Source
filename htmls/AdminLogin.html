<div class="lg-site" data-page="AdminLogin" id="lg-root">
<main class="lg-wrap">
    <div class="lg-card">
        <a class="lg-logo" href="Home"><svg viewBox="0 0 40 40" width="36" height="36" aria-hidden="true"><rect width="40" height="40" rx="10" fill="#1E2A33"/><path d="M9 20.5 20 11l11 9.5" fill="none" stroke="#F7F4EE" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M13 19v11h14V19" fill="none" stroke="#F7F4EE" stroke-width="3" stroke-linejoin="round"/><path d="M20 30c-2.6 0-4-1.7-4-3.6 0-2.4 2.4-3.4 2.4-5.7 1.7.9 2.8 2.4 2.8 4 .5-.3.9-.9 1-1.6.8.8 1.8 1.9 1.8 3.3 0 1.9-1.4 3.6-4 3.6z" fill="#E2622B"/></svg><span>{plhd_brand}</span></a>
        <h1>Staff sign in</h1>
        {plhd_first}
        {plhd_demo}
        <form class="lg-form" id="lg-form" onsubmit="return AdminLoginJs.go()" novalidate>
            <label class="lg-field" for="lg-user"><span>User name</span><input type="text" id="lg-user" maxlength="40" autocomplete="username" value="{plhd_user}"></label>
            <label class="lg-field" for="lg-pass"><span>Password</span><input type="password" id="lg-pass" maxlength="100" autocomplete="current-password" value="{plhd_pass}"></label>
            <div class="lg-new" id="lg-new" hidden>
                <p class="lg-note">Choose your own password before you continue. Use 8 characters or more.</p>
                <label class="lg-field" for="lg-np1"><span>New password</span><input type="password" id="lg-np1" maxlength="100" autocomplete="new-password"></label>
                <label class="lg-field" for="lg-np2"><span>New password again</span><input type="password" id="lg-np2" maxlength="100" autocomplete="new-password"></label>
            </div>
            <em class="lg-err" id="lg-msg" role="alert"></em>
            <button type="submit" class="lg-btn lg-wide" id="lg-btn">Sign in</button>
        </form>
        <a class="lg-back" href="Home">Back to the website</a>
    </div>
</main>
<div class="lg-toast" id="lg-toast" role="status" aria-live="polite"></div>
</div>
